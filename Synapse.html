<!-- FIX: the PDF code referenced "Noto Sans Devanagari", "Noto
     Sans SC", "Noto Sans Arabic", etc. by name in its CSS, but
     those fonts were never actually loaded anywhere. Most
     machines don't have them installed system-wide, so the
     browser silently fell back to Arial/Segoe UI - which have no

     wrong fallback rendering (boxes, wrong script, or the closest

<script>
 
/* =====================================================
   TAB FUNCTIONS
===================================================== */
 
 
function showTextTab() {
 
    document.getElementById("textSection").style.display = "block";
 
    document.getElementById("imageSection").style.display = "none";
 
    document.querySelectorAll(".tab-button")[0]
        .classList.add("active");
 
    document.querySelectorAll(".tab-button")[1]
        .classList.remove("active");
}
 
 
function showImageTab() {
 
    document.getElementById("textSection").style.display = "none";
 
    document.getElementById("imageSection").style.display = "block";
 
    document.querySelectorAll(".tab-button")[0]
        .classList.remove("active");
 
    document.querySelectorAll(".tab-button")[1]
        .classList.add("active");
}
 
 
function setStatus(elementId, message, type) {
 
    const el = document.getElementById(elementId);
 
    el.innerText = message;
 
    el.className = "status" + (type ? " " + type : "");
 
}
 
 
 
/* =====================================================
   CHUNKING HELPERS
   (MyMemory's free API rejects any single request whose
   encoded "q" text exceeds ~500 bytes, and throwing the
   whole textarea at it in one shot is what caused the
   "QUERY LENGTH LIMIT EXCEEDED" error. These helpers split
   long text into safe-sized pieces along sentence
   boundaries, translate each piece separately, then
   reassemble the result.)
===================================================== */
 
 
// Max bytes we allow per chunk. MyMemory's real limit is ~500
// bytes for the whole querystring value; we stay well under
// that to leave room for URL-encoding expansion (e.g. "é" ->
// "%C3%A9") and language-pair params.
const MAX_CHUNK_BYTES = 450;
 
 
function byteLength(str) {
 
    // UTF-8 byte length, not JS string length (multi-byte
    // characters like Hindi/Chinese script take more bytes).
    return new Blob([str]).size;
}
 
 
function splitIntoChunks(text, maxBytes) {
 
    // Split on sentence-ish boundaries first so we don't cut
    // words in half. Falls back to splitting on spaces, and
    // finally on raw characters, for text with no punctuation
    // (e.g. a single very long word or no spaces at all).
    const sentences =
        text.match(/[^.!?\n]+[.!?\n]*|[^.!?\n]+$/g) || [text];
 
    const chunks = [];
    let current = "";
 
    function pushCurrent() {
        if (current.trim()) {
            chunks.push(current.trim());
        }
        current = "";
    }
 
    for (let sentence of sentences) {
 
        sentence = sentence.trim();
        if (!sentence) continue;
 
        // If a single "sentence" is itself too big, break it
        // down further by words (and by raw chars as a last
        // resort) before adding to chunks.
        if (byteLength(sentence) > maxBytes) {
 
            pushCurrent();
 
            const words = sentence.split(/\s+/);
            let piece = "";
 
            for (const word of words) {
 
                const candidate = piece ? piece + " " + word : word;
 
                if (byteLength(candidate) > maxBytes) {
 
                    if (piece) {
                        chunks.push(piece);
                        piece = "";
                    }
 
                    // Single word still too long on its own -
                    // hard-slice it by characters.
                    if (byteLength(word) > maxBytes) {
 
                        let start = 0;
 
                        while (start < word.length) {
 
                            let end = word.length;
 
                            while (
                                end > start &&
                                byteLength(word.slice(start, end)) > maxBytes
                            ) {
                                end--;
                            }
 
                            chunks.push(word.slice(start, end));
                            start = end;
                        }
 
                    } else {
                        piece = word;
                    }
 
                } else {
                    piece = candidate;
                }
            }
 
            if (piece) chunks.push(piece);
 
            continue;
        }
 
        const candidate = current ? current + " " + sentence : sentence;
 
        if (byteLength(candidate) > maxBytes) {
            pushCurrent();
            current = sentence;
        } else {
            current = candidate;
        }
    }
 
    pushCurrent();
 
    return chunks;
}
 
 
async function translateChunk(chunk, source, target) {
 
    const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(chunk) +
        "&langpair=" +
        source +
        "|" +
        target;
 
    const response = await fetch(url);
 
    if (!response.ok) {
        throw new Error("Network response was not OK (" + response.status + ")");
    }
 
    const data = await response.json();
 
    if (!data.responseData || typeof data.responseData.translatedText !== "string") {
        throw new Error("Translation failed");
    }
 
    // MyMemory sometimes returns its own quota/length message
    // inside a 200 response instead of an HTTP error.
    if (/QUERY LENGTH LIMIT EXCEEDED/i.test(data.responseData.translatedText)) {
        throw new Error("QUERY LENGTH LIMIT EXCEEDED");
    }
 
    return data.responseData.translatedText;
}
 
 
/*
  Translates arbitrarily long text by chunking it, translating
  each chunk in sequence (sequential, not parallel, to stay
  polite to the free API's rate limits), and joining the
  results back together. Calls onProgress(doneCount, total)
  after each chunk so the caller can update status text.
*/
async function translateLongText(text, source, target, onProgress) {
 
    const chunks = splitIntoChunks(text, MAX_CHUNK_BYTES);
 
    const translatedChunks = [];
 
    for (let i = 0; i < chunks.length; i++) {
 
        const translated = await translateChunk(chunks[i], source, target);
 
        translatedChunks.push(translated);
 
        if (onProgress) {
            onProgress(i + 1, chunks.length);
        }
    }
 
    return translatedChunks.join(" ");
}
 
 
 
/* =====================================================
   TEXT TRANSLATION
===================================================== */
 
 
async function translateText() {
 
    const text =
        document.getElementById("inputText").value.trim();
 
    const source =
        document.getElementById("sourceLanguage").value;
 
    const target =
        document.getElementById("targetLanguage").value;
 
    const output =
        document.getElementById("translatedText");
 
    const translateBtn =
        document.getElementById("translateBtn");
 
    const pdfBtn =
        document.getElementById("textPdfBtn");
 
 
    if (!text) {
 
        setStatus("textStatus", "Please enter some text.", "error");
 
        return;
    }
 
 
    if (source === target) {
 
        output.value = text;
 
        pdfBtn.disabled = false;
 
        setStatus("textStatus", "Source and target languages are the same.", "");
 
        return;
    }
 
 
    output.value = "";
 
    pdfBtn.disabled = true;
 
    translateBtn.disabled = true;
 
 
    try {
 
        const translated = await translateLongText(
            text,
            source,
            target,
            function (done, total) {
 
                if (total > 1) {
                    setStatus(
                        "textStatus",
                        "Translating part " + done + " of " + total + "...",
                        ""
                    );
                } else {
                    setStatus("textStatus", "Translating...", "");
                }
            }
        );
 
        output.value = translated;
 
        pdfBtn.disabled = false;
 
        setStatus("textStatus", "Translation completed.", "success");
 
    }
 
    catch(error) {
 
        console.error(error);
 
        if (/QUERY LENGTH LIMIT EXCEEDED/i.test(error.message)) {
            setStatus(
                "textStatus",
                "Even after splitting, one part was still too long for the translation service. Try shortening your text.",
                "error"
            );
        } else {
            setStatus("textStatus", "Translation failed. Check your internet connection or try shorter text.", "error");
        }
 
    }
 
    finally {
 
        translateBtn.disabled = false;
 
    }
 
}
 
 
 
/* =====================================================
   SWAP LANGUAGES
===================================================== */
 
 
function swapLanguages() {
 
    const source =
        document.getElementById("sourceLanguage");
 
    const target =
        document.getElementById("targetLanguage");
 
 
    const oldSource =
        source.value;
 
 
    source.value =
        target.value;
 
 
    target.value =
        oldSource;
 
 
    const input =
        document.getElementById("inputText");
 
    const output =
        document.getElementById("translatedText");
 
 
    const oldText =
        input.value;
 
 
    input.value =
        output.value;
 
 
    output.value =
        oldText;
 
    document.getElementById("textPdfBtn").disabled = !output.value;
 
}
 
 
 
/* =====================================================
   IMAGE OCR
===================================================== */
 
 
async function readImage(event) {
 
    const file =
        event.target.files[0];
 
 
    if (!file) {
 
        return;
    }
 
 
    const preview =
        document.getElementById("imagePreview");
 
 
    const extracted =
        document.getElementById("extractedText");
 
 
    const progress =
        document.getElementById("progressBar");
 
 
    /*
      Show image
    */
 
    preview.src =
        URL.createObjectURL(file);
 
    preview.style.display =
        "block";
 
 
    /*
      Clear old result
    */
 
    extracted.value = "";
 
    document.getElementById(
        "imageTranslatedText"
    ).value = "";
 
    document.getElementById("imagePdfBtn").disabled = true;
 
 
    progress.style.width =
        "0%";
 
 
    setStatus("imageStatus", "Reading text from image...", "");
 
 
    try {
 
        /*
          Tesseract OCR
        */
 
        const result =
            await Tesseract.recognize(
 
                file,
 
                document.getElementById(
                    "imageLanguage"
                ).value,
 
                {
 
                    logger: function(message) {
 
                        if (
                            message.status ===
                            "recognizing text"
                        ) {
 
                            const percent =
                                Math.round(
                                    message.progress * 100
                                );
 
 
                            progress.style.width =
                                percent + "%";
 
 
                            setStatus("imageStatus", "Reading image... " + percent + "%", "");
 
                        }
 
                    }
 
                }
 
            );
 
 
        /*
          Display extracted text
        */
 
        extracted.value =
            result.data.text.trim();
 
 
        progress.style.width =
            "100%";
 
 
        if (extracted.value) {
 
            setStatus("imageStatus", "Text extracted successfully.", "success");
 
        }
 
        else {
 
            setStatus("imageStatus", "No text found in image.", "error");
 
        }
 
 
    }
 
    catch(error) {
 
        console.error(error);
 
        setStatus("imageStatus", "OCR failed. Try a clearer image or a different language setting.", "error");
 
    }
 
}
 
 
 
/* =====================================================
   TRANSLATE IMAGE TEXT
===================================================== */
 
 
async function translateImageText() {
 
    const text =
        document.getElementById(
            "extractedText"
        ).value.trim();
 
 
    const target =
        document.getElementById(
            "imageTargetLanguage"
        ).value;
 
 
    const output =
        document.getElementById(
            "imageTranslatedText"
        );
 
 
    const pdfBtn =
        document.getElementById("imagePdfBtn");
 
 
    if (!text) {
 
        setStatus("imageStatus", "First upload an image and extract text.", "error");
 
        return;
 
    }
 
 
    /*
      Convert Tesseract language
      into MyMemory language code
    */
 
    const languageMap = {
 
        eng: "en",
        hin: "hi",
        mar: "mr",
        kan: "kn",
        tam: "ta",
        tel: "te",
        ben: "bn",
        guj: "gu",
        spa: "es",
        fra: "fr",
        deu: "de",
        ita: "it",
        por: "pt",
        rus: "ru",
        ara: "ar",
        "chi_sim": "zh-CN",
        jpn: "ja",
        kor: "ko"
 
    };
 
 
    const sourceTess =
        document.getElementById(
            "imageLanguage"
        ).value;
 
 
    const source =
        languageMap[sourceTess] || "en";
 
 
    pdfBtn.disabled = true;
 
 
    try {
 
        const translated = await translateLongText(
            text,
            source,
            target,
            function (done, total) {
 
                if (total > 1) {
                    setStatus(
                        "imageStatus",
                        "Translating part " + done + " of " + total + "...",
                        ""
                    );
                } else {
                    setStatus("imageStatus", "Translating image text...", "");
                }
            }
        );
 
        output.value = translated;
 
        pdfBtn.disabled = false;
 
        setStatus("imageStatus", "Image translation completed.", "success");
 
    }
 
    catch(error) {
 
        console.error(error);
 
        if (/QUERY LENGTH LIMIT EXCEEDED/i.test(error.message)) {
            setStatus(
                "imageStatus",
                "Even after splitting, one part was still too long for the translation service. Try a shorter passage.",
                "error"
            );
        } else {
            setStatus("imageStatus", "Translation failed. Check your internet connection or try shorter text.", "error");
        }
 
    }
 
}
 
 
 
/* =====================================================
   PDF HELPERS
 
   HISTORY OF THIS BUG:
   1) Originally this drew text with jsPDF's own pdf.text(),
      whose built-in fonts are Latin-only, so Hindi/Chinese/
      Arabic/etc. came out blank or as boxes.
   2) That was changed to render an HTML container through
      jsPDF's .html() (which uses the html2canvas library
      under the hood) so the browser's own font engine would
      draw the glyphs. But the CSS referenced webfont names
      ("Noto Sans Devanagari", "Noto Sans SC", etc.) that were
      never actually loaded, so it silently fell back to a
      Latin-only font and captured the WRONG script into the
      PDF.
   3) Loading those webfonts and awaiting them before capture
      was tried next - but html2canvas renders by cloning the
      whole page into a hidden, separate iframe document. Fonts
      loaded dynamically in the main document are not
      guaranteed to be loaded yet inside that cloned iframe by
      the time it takes its snapshot, which is what produced a
      BLANK PDF instead of wrong text.
 
   FIX: stop going through html2canvas/.html() altogether. We
   draw the text ourselves directly onto a plain <canvas> in
   the SAME document (so the fonts we just loaded definitely
   apply), word-wrap it ourselves (character-by-character for
   scripts like Chinese/Japanese that don't use spaces), and
   embed the canvas as an image into the PDF with
   pdf.addImage(). This has no iframe in the middle, so there
   is nothing for the fonts to fail to reach.
===================================================== */
 
 
// The exact webfont families we ask the canvas to use, in
// fallback order, so whichever script the translation is in
// (Devanagari, Han, Arabic, Hangul, etc.) picks up a font that
// actually has those glyphs.
const PDF_FONT_FAMILIES = [
    "Noto Sans",
    "Noto Sans Devanagari",
    "Noto Sans SC",
    "Noto Sans Arabic",
    "Noto Sans JP",
    "Noto Sans KR",
    "Noto Sans Bengali",
    "Noto Sans Gujarati",
    "Noto Sans Kannada",
    "Noto Sans Tamil",
    "Noto Sans Telugu"
];
 
const CANVAS_FONT_STACK =
    PDF_FONT_FAMILIES.map(function (f) { return '"' + f + '"'; }).join(", ") +
    ", Arial, sans-serif";
 
// Layout constants. We render at 2x a nominal 1000px-wide
// column for crisp text, then scale that down to the actual
// point size on the page.
const CANVAS_CONTENT_WIDTH_PX = 2000;
const PAGE_WIDTH_PT = 595.28;   // A4
const PAGE_HEIGHT_PT = 841.89;  // A4
const MARGIN_PT = 30;
const CONTENT_WIDTH_PT = PAGE_WIDTH_PT - MARGIN_PT * 2;
const PT_PER_PX = CONTENT_WIDTH_PT / CANVAS_CONTENT_WIDTH_PX;
const MAX_PAGE_CONTENT_HEIGHT_PX =
    (PAGE_HEIGHT_PT - MARGIN_PT * 2) / PT_PER_PX;
 
const TITLE_FONT_PX = 48;
const LABEL_FONT_PX = 32;
const BODY_FONT_PX = 32;
const BODY_LINE_HEIGHT_PX = BODY_FONT_PX * 1.6;
 
 
async function waitForFontsToLoad() {
 
    if (!document.fonts) {
        // Very old browser without the Font Loading API - nothing
        // we can do but proceed with whatever font is available.
        return;
    }
 
    const loaders = PDF_FONT_FAMILIES.map(function (family) {
 
        return document.fonts
            .load('400 32px "' + family + '"')
            .catch(function () {
                // If a particular family fails to load (e.g. offline),
                // don't block the whole PDF - just fall through to
                // whatever fallback is available for that script.
            });
    });
 
    // Race the "everything settle" signal against a timeout so a
    // stuck/never-resolving font request can never hang PDF
    // generation forever.
    await Promise.race([
        Promise.all(loaders).then(function () {
            return document.fonts.ready;
        }),
        new Promise(function (resolve) {
            setTimeout(resolve, 3000);
        })
    ]);
}
 
 
function fontString(sizePx, bold) {
    return (bold ? "bold " : "") + sizePx + "px " + CANVAS_FONT_STACK;
}
 
 
// Wraps `text` to fit within `maxWidth` (canvas px) using
// `ctx`'s currently-set font. Splits on whitespace first (for
// space-separated scripts); any "word" that is itself wider
// than maxWidth (a long run of characters with no spaces, as
// in Chinese/Japanese) is broken down character by character
// so nothing ever overflows or gets silently dropped.
function wrapText(ctx, text, maxWidth) {
 
    const lines = [];
    const words = text.split(/(\s+)/).filter(function (w) { return w !== ""; });
 
    let currentLine = "";
 
    function widthOf(str) {
        return ctx.measureText(str).width;
    }
 
    for (let word of words) {
 
        // A single "word" too wide on its own - hard-break it by
        // character before it ever becomes part of currentLine.
        if (widthOf(word) > maxWidth) {
 
            if (currentLine.trim()) {
                lines.push(currentLine.trimEnd());
                currentLine = "";
            }
 
            let piece = "";
            for (const ch of word) {
                const candidate = piece + ch;
                if (widthOf(candidate) > maxWidth && piece) {
                    lines.push(piece);
                    piece = ch;
                } else {
                    piece = candidate;
                }
            }
            currentLine = piece;
            continue;
        }
 
        const candidate = currentLine + word;
 
        if (widthOf(candidate) > maxWidth && currentLine.trim()) {
            lines.push(currentLine.trimEnd());
            currentLine = word.replace(/^\s+/, "");
        } else {
            currentLine = candidate;
        }
    }
 
    if (currentLine.trim() || lines.length === 0) {
        lines.push(currentLine.trimEnd());
    }
 
    return lines;
}
 
 
// Lays out the title + labelled text blocks into a flat list of
// draw items (text, y position, font size, bold), without
// drawing anything yet. `ctx` only needs to support
// measureText - it can be a throwaway canvas context.
function layoutContent(ctx, title, blocks) {
 
    const items = [];
    let cursorY = 0;
 
    ctx.font = fontString(TITLE_FONT_PX, true);
    items.push({ text: title, y: cursorY, fontPx: TITLE_FONT_PX, bold: true });
    cursorY += TITLE_FONT_PX * 1.3 + 40;
 
    blocks.forEach(function (block, idx) {
 
        if (idx > 0) {
            cursorY += 20;
        }
 
        ctx.font = fontString(LABEL_FONT_PX, true);
        items.push({ text: block.label, y: cursorY, fontPx: LABEL_FONT_PX, bold: true });
        cursorY += LABEL_FONT_PX * 1.3 + 16;
 
        ctx.font = fontString(BODY_FONT_PX, false);
 
        const content = block.text && block.text.trim() ? block.text.trim() : "(none)";
 
        content.split("\n").forEach(function (paragraph) {
 
            if (paragraph === "") {
                cursorY += BODY_LINE_HEIGHT_PX;
                return;
            }
 
            wrapText(ctx, paragraph, CANVAS_CONTENT_WIDTH_PX).forEach(function (line) {
                items.push({ text: line, y: cursorY, fontPx: BODY_FONT_PX, bold: false });
                cursorY += BODY_LINE_HEIGHT_PX;
            });
        });
    });
 
    cursorY += 20;
 
    return { items: items, totalHeight: cursorY };
}
 
 
// Groups the flat item list into pages, never splitting a
// single line of text across two pages.
function paginateLayout(layout) {
 
    const pages = [];
    let currentPageStartY = 0;
    let currentPageItems = [];
 
    layout.items.forEach(function (item) {
 
        const itemBottom = item.y + item.fontPx * 1.3;
 
        if (
            currentPageItems.length > 0 &&
            itemBottom - currentPageStartY > MAX_PAGE_CONTENT_HEIGHT_PX
        ) {
            pages.push({ items: currentPageItems, startY: currentPageStartY });
            currentPageStartY = item.y;
            currentPageItems = [];
        }
 
        currentPageItems.push(item);
    });
 
    if (currentPageItems.length > 0) {
        pages.push({ items: currentPageItems, startY: currentPageStartY });
    }
 
    return pages;
}
 
 
/*
  Waits for fonts, lays out the title + labelled text blocks,
  paginates them, draws each page onto its own canvas (in this
  same document, so the loaded fonts are guaranteed to apply),
  and assembles the pages into a saved PDF.
*/
async function renderTextPDF(title, blocks, filename) {
 
    console.log("[Synapse PDF] starting", { title: title, blockCount: blocks.length });
 
    if (!window.jspdf || !window.jspdf.jsPDF) {
        throw new Error("jsPDF library did not load (check your internet connection / ad-blocker and reload the page).");
    }
 
    await waitForFontsToLoad();
 
    const measureCanvas = document.createElement("canvas");
    const measureCtx = measureCanvas.getContext("2d");
 
    if (!measureCtx) {
        throw new Error("This browser would not give us a 2D canvas context.");
    }
 
    const layout = layoutContent(measureCtx, title, blocks);
 
    console.log("[Synapse PDF] layout computed", {
        itemCount: layout.items.length,
        totalHeight: layout.totalHeight,
        firstFewItems: layout.items.slice(0, 3)
    });
 
    if (!layout.items.length) {
        throw new Error("Nothing to render - layout produced zero text items.");
    }
 
    const pages = paginateLayout(layout);
 
    console.log("[Synapse PDF] pages", pages.length);
 
    if (!pages.length) {
        throw new Error("Nothing to render - pagination produced zero pages.");
    }
 
    const { jsPDF } = window.jspdf;
 
    const pdf = new jsPDF({
        unit: "pt",
        format: "a4"
    });
 
    pages.forEach(function (page, pageIndex) {
 
        const pageHeightPx = Math.ceil(
            Math.max.apply(null, page.items.map(function (item) {
                return (item.y - page.startY) + item.fontPx * 1.3;
            })) + 10
        );
 
        if (!isFinite(pageHeightPx) || pageHeightPx <= 0) {
            throw new Error("Computed an invalid page height (" + pageHeightPx + ") on page " + (pageIndex + 1) + ".");
        }
 
        const pageCanvas = document.createElement("canvas");
        pageCanvas.width = CANVAS_CONTENT_WIDTH_PX;
        pageCanvas.height = pageHeightPx;
 
        const pageCtx = pageCanvas.getContext("2d");
 
        if (!pageCtx) {
            throw new Error("This browser would not give us a 2D canvas context for page " + (pageIndex + 1) + ".");
        }
 
        pageCtx.fillStyle = "#ffffff";
        pageCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        pageCtx.fillStyle = "#000000";
        pageCtx.textBaseline = "top";
 
        let drawnCount = 0;
 
        page.items.forEach(function (item) {
            if (!item.text) return;
            pageCtx.font = fontString(item.fontPx, item.bold);
            pageCtx.fillText(item.text, 0, item.y - page.startY);
            drawnCount++;
        });
 
        console.log("[Synapse PDF] page " + (pageIndex + 1) + " drew " + drawnCount + " lines, canvas " + pageCanvas.width + "x" + pageCanvas.height);
 
        const imgData = pageCanvas.toDataURL("image/png");
 
        // A completely blank white PNG at this size compresses to a
        // very short data URL. If we see one, something upstream
        // (fonts / drawing) silently failed - surface that instead
        // of quietly shipping an empty page.
        if (imgData.length < 1500) {
            throw new Error(
                "Page " + (pageIndex + 1) + " rendered as a blank image (data length " +
                imgData.length + "). This usually means the canvas font failed to apply."
            );
        }
 
        const imgHeightPt = pageHeightPx * PT_PER_PX;
 
        if (pageIndex > 0) {
            pdf.addPage();
        }
 
        pdf.addImage(
            imgData,
            "PNG",
            MARGIN_PT,
            MARGIN_PT,
            CONTENT_WIDTH_PT,
            imgHeightPt
        );
    });
 
    pdf.save(filename);
 
    console.log("[Synapse PDF] saved", filename);
}
 
 
 
/* =====================================================
   DOWNLOAD TEXT PDF
===================================================== */
 
 
async function downloadTextPDF() {
 
    const input =
        document.getElementById("inputText").value;
 
 
    const output =
        document.getElementById("translatedText").value;
 
 
    if (!output.trim()) {
 
        setStatus("textStatus", "Translate some text before downloading a PDF.", "error");
 
        return;
 
    }
 
 
    const pdfBtn = document.getElementById("textPdfBtn");
 
    pdfBtn.disabled = true;
 
    setStatus("textStatus", "Generating PDF...", "");
 
 
    try {
 
        await renderTextPDF(
            "Synapse Translation",
            [
                { label: "Original Text:", text: input },
                { label: "Translation:", text: output }
            ],
            "synapse-translation.pdf"
        );
 
        setStatus("textStatus", "PDF downloaded.", "success");
 
    } catch (error) {
 
        console.error(error);
 
        setStatus(
            "textStatus",
            "Could not generate the PDF: " + (error && error.message ? error.message : "unknown error") +
                " (open the browser console for details)",
            "error"
        );
 
    } finally {
 
        pdfBtn.disabled = false;
 
    }
 
}
 
 
 
/* =====================================================
   DOWNLOAD IMAGE PDF
===================================================== */
 
 
async function downloadImagePDF() {
 
    const extracted =
        document.getElementById("extractedText").value;
 
 
    const translated =
        document.getElementById("imageTranslatedText").value;
 
 
    if (!translated.trim()) {
 
        setStatus("imageStatus", "Translate the extracted text before downloading a PDF.", "error");
 
        return;
 
    }
 
 
    const pdfBtn = document.getElementById("imagePdfBtn");
 
    pdfBtn.disabled = true;
 
    setStatus("imageStatus", "Generating PDF...", "");
 
 
    try {
 
        await renderTextPDF(
            "Synapse Image Translation",
            [
                { label: "Extracted Text:", text: extracted },
                { label: "Translation:", text: translated }
            ],
            "synapse-image-translation.pdf"
        );
 
        setStatus("imageStatus", "PDF downloaded.", "success");
 
    } catch (error) {
 
        console.error(error);
 
        setStatus(
            "imageStatus",
            "Could not generate the PDF: " + (error && error.message ? error.message : "unknown error") +
                " (open the browser console for details)",
            "error"
        );
 
    } finally {
 
        pdfBtn.disabled = false;
 
    }
 
}
