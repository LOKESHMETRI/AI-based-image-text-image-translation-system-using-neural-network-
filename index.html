<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Image Text Translator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🌐 AI Image Text Translator</h1>
      <p class="subtitle">OCR (EasyOCR) + Neural Machine Translation (MarianMT)</p>
    </header>

    <main>
      <section class="controls">
        <label class="upload-box" id="dropZone">
          <input type="file" id="imageInput" accept="image/*" hidden />
          <span id="uploadText">Click or drag an image here</span>
        </label>

        <div class="lang-row">
          <label>
            Source language
            <select id="sourceLang">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="mr">Marathi</option>
              <option value="kn">Kannada</option>
            </select>
          </label>

          <label>
            Target language
            <select id="targetLang">
              <option value="hi">Hindi</option>
              <option value="mr">Marathi</option>
              <option value="en">English</option>
              <option value="kn">Kannada</option>
            </select>
          </label>
        </div>

        <button id="translateBtn" disabled>Translate Image</button>
      </section>

      <section class="results">
        <div class="preview">
          <h2>Image Preview</h2>
          <img id="previewImg" alt="Preview will appear here" />
        </div>

        <div class="text-panels">
          <div class="panel">
            <h2>Extracted Text</h2>
            <div id="originalText" class="text-box"></div>
          </div>
          <div class="panel">
            <h2>Translated Text</h2>
            <div id="translatedText" class="text-box"></div>
          </div>
        </div>
      </section>

      <p id="status"></p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
